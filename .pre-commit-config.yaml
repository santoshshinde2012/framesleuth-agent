repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        # Any Python 3 (3.11+) — not pinned to a version that may be absent
        # locally, which would fail every commit on the version mismatch alone.
        language_version: python3

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]

  # Linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        args: ["--fix"]

  # Type checking runs in CI and locally via `mypy --strict framesleuth` in the
  # project venv — NOT as a pre-commit hook, which runs in an isolated env that
  # can't see the runtime deps (aiohttp, fastapi, av, …) and so reports spurious
  # import-not-found errors. Enumerating every dep into additional_dependencies
  # is brittle; the venv/CI run is authoritative. (The GitHub Actions workflow
  # runs it on every push/PR.)

  # Trailing whitespace and EOL
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [mypy]  # Skip in CI, run separately with pytest
  submodules: false
