name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a busy PR doesn't queue stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; a job that needs more asks for it explicitly.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install from the lock, never re-resolve. Without this a green build can
      # go red overnight with no commit behind it, and CI failures stop being
      # reproducible locally.
      #
      # The check runs first so a pyproject edit that was never re-locked fails
      # here instead of being ignored by the sync.
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install project (locked, dev extras)
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run ruff check framesleuth tests

      - name: Black (format check)
        run: uv run black --check framesleuth tests

      - name: Mypy (strict)
        run: uv run mypy --strict framesleuth

      - name: Pytest (with coverage gate)
        run: uv run pytest tests/ -q --cov=framesleuth --cov-report=term-missing:skip-covered --cov-fail-under=75

      # Per-metric floors + a max-regression check against evals/baseline.json,
      # so a slide that is still above the floor (1.00 -> 0.89) also fails.
      - name: Eval harness (behavioral gates)
        run: uv run python scripts/eval_harness.py --behavioral --json-out eval-metrics.json

      - name: Upload eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics-py${{ matrix.python-version }}
          path: eval-metrics.json
          retention-days: 14

      # The website generates its typed client from this schema. If a route
      # changes and the committed schema isn't regenerated, the two silently
      # drift — so make that a failing diff rather than a runtime surprise.
      - name: OpenAPI schema is current
        run: uv run python scripts/export_openapi.py --check --out openapi.json

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Audit the locked set, not a fresh resolve, or the report says nothing
      # about what actually ships. pip-audit comes in via `--with` so it does
      # not perturb the environment it is auditing.
      - name: Install project (locked)
        run: uv sync --frozen --extra dev

      # Known-vulnerable dependencies. Reported but non-blocking: an advisory in
      # a transitive dep should surface immediately, not gate an unrelated fix.
      #
      # Nothing in the runtime set carries an advisory. As of 2026-08-09 it
      # reports three, all dev tooling and all unreachable here. Listed so you
      # can tell a new finding from the usual noise:
      #
      #   black 23.12.0  GHSA-3936-cmfr-pm3m  needs --python-cell-magics, unused
      #   black 23.12.0  GHSA-fj7x-q9j7-g6q6  ReDoS on hostile source
      #   pytest 7.4.3   GHSA-6w46-j5rx-g56g  local tmpdir permissions
      #
      # Not upgrading black for these: the fix is 26.3.1, which reformats the
      # whole codebase. Anything appearing here that is not on this list is
      # worth a look.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --skip-editable || true

      # The repo already configures pre-commit (with detect-secrets) but nothing
      # ran it, so the hooks only fired for contributors who installed them.
      - name: pre-commit
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure
