name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a busy PR doesn't queue stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; a job that needs more asks for it explicitly.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # `--frozen` against a committed uv.lock, not `uv pip install -e ".[dev]"`.
      # That re-resolved every dependency on every run, so a green build could go
      # red overnight with no commit behind it, and an upstream release — broken
      # or hostile — landed here with nothing to review. It also meant nobody
      # could reproduce a CI failure locally, because "the same install" was a
      # different set of versions each time.
      #
      # `uv lock --check` first so a pyproject edit that was never re-locked
      # fails loudly here rather than being silently ignored by the sync.
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install project (locked, dev extras)
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run ruff check framesleuth tests

      - name: Black (format check)
        run: uv run black --check framesleuth tests

      - name: Mypy (strict)
        run: uv run mypy --strict framesleuth

      - name: Pytest (with coverage gate)
        run: uv run pytest tests/ -q --cov=framesleuth --cov-report=term-missing:skip-covered --cov-fail-under=75

      # Per-metric floors + a max-regression check against evals/baseline.json,
      # so a slide that is still above the floor (1.00 -> 0.89) also fails.
      - name: Eval harness (behavioral gates)
        run: uv run python scripts/eval_harness.py --behavioral --json-out eval-metrics.json

      - name: Upload eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics-py${{ matrix.python-version }}
          path: eval-metrics.json
          retention-days: 14

      # The website generates its typed client from this schema. If a route
      # changes and the committed schema isn't regenerated, the two silently
      # drift — so make that a failing diff rather than a runtime surprise.
      - name: OpenAPI schema is current
        run: uv run python scripts/export_openapi.py --check --out openapi.json

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Audit the LOCKED set — the versions this project actually installs.
      # Re-resolving here meant pip-audit scanned a dependency set that existed
      # nowhere else: a clean report proved nothing about what CI ran or what a
      # contributor got, and a real advisory against a pinned version could be
      # missed because the scan silently resolved past it.
      #
      # pip-audit comes via `--with` so the tool is available without being
      # added to, or perturbing, the environment being audited.
      - name: Install project (locked)
        run: uv sync --frozen --extra dev

      # Known-vulnerable dependencies. Reported but non-blocking: an advisory in
      # a transitive dep should surface immediately, not gate an unrelated fix.
      #
      # Because it never fails the build, the output only helps if someone reads
      # it. Against the committed uv.lock (90 packages, checked 2026-08-09) it
      # reports three findings, all in DEV tooling and all triaged as
      # unreachable here — recorded so the next reader compares against this
      # list instead of re-deriving it:
      #
      #   black 23.12.0  GHSA-3936-cmfr-pm3m (HIGH)  needs attacker control of
      #                  --python-cell-magics; we never pass that option, and
      #                  black runs as `black --check framesleuth tests`.
      #   black 23.12.0  GHSA-fj7x-q9j7-g6q6 (MED)   ReDoS on hostile source.
      #   pytest 7.4.3   GHSA-6w46-j5rx-g56g (MED)   local tmpdir permissions.
      #
      # NOTHING in the runtime dependency set carries an advisory. The two
      # setuptools findings that used to be here went away with the lockfile —
      # they came from the ambient build environment the old unpinned install
      # happened to resolve, which is its own small argument for pinning.
      #
      # Deliberately NOT auto-upgraded: the fix for the black findings is 26.3.1,
      # which reformats the entire codebase. A repo-wide diff to close an
      # unreachable advisory buys nothing and buries real changes. Anything that
      # appears here and is NOT on this list deserves a look.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --skip-editable || true

      # The repo already configures pre-commit (with detect-secrets) but nothing
      # ran it, so the hooks only fired for contributors who installed them.
      - name: pre-commit
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure
